<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BarberFlow API - Servidor REST Mock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #18181b;
      --border: #27272a;
      --gold: #fbbf24;
      --gold-dark: #d97706;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --green: #10b981;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 24px; }
    .logo { font-size: 24px; font-weight: 800; color: var(--gold); letter-spacing: 2px; }
    .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .badge { background: var(--border); border: 1px solid var(--gold); color: var(--gold); padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 32px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .card-title { font-size: 16px; font-weight: 800; color: var(--gold); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .endpoint-link { font-size: 12px; color: var(--gold); text-decoration: none; background: rgba(251,191,36,0.1); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--gold); }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
    th { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
    
    .status-agendado { color: var(--gold); background: rgba(251,191,36,0.15); padding: 3px 8px; border-radius: 12px; font-weight: 700; font-size: 11px; }
    .status-concluido { color: var(--green); background: rgba(16,185,129,0.15); padding: 3px 8px; border-radius: 12px; font-weight: 700; font-size: 11px; }
    .status-cancelado { color: var(--red); background: rgba(239,68,68,0.15); padding: 3px 8px; border-radius: 12px; font-weight: 700; font-size: 11px; }

    pre { background: #121215; border: 1px solid var(--border); padding: 16px; border-radius: 10px; color: var(--gold); font-size: 12px; overflow-x: auto; max-height: 250px; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="logo">BARBERFLOW API</div>
      <div class="subtitle">Painel de Controle REST HTTP • Disciplina PAM</div>
    </div>
    <div class="badge">JSON-SERVER ATIVO</div>
  </div>

  <div class="grid">
    <!-- Card Agendamentos -->
    <div class="card">
      <div class="card-title">
        <span>AGENDAMENTOS</span>
        <a href="/agendamentos" target="_blank" class="endpoint-link">GET /agendamentos ↗</a>
      </div>
      <div id="agendamentos-table">Carregando...</div>
    </div>

    <!-- Card Serviços -->
    <div class="card">
      <div class="card-title">
        <span>SERVIÇOS OFERECIDOS</span>
        <a href="/servicos" target="_blank" class="endpoint-link">GET /servicos ↗</a>
      </div>
      <div id="servicos-table">Carregando...</div>
    </div>

    <!-- Card Profissionais -->
    <div class="card">
      <div class="card-title">
        <span>PROFISSIONAIS</span>
        <a href="/profissionais" target="_blank" class="endpoint-link">GET /profissionais ↗</a>
      </div>
      <div id="profissionais-table">Carregando...</div>
    </div>
  </div>

  <script>
    async function loadData() {
      try {
        const [agRes, serRes, profRes] = await Promise.all([
          fetch('/agendamentos'),
          fetch('/servicos'),
          fetch('/profissionais')
        ]);
        const agendamentos = await agRes.json();
        const servicos = await serRes.json();
        const profissionais = await profRes.json();

        // Render Agendamentos
        let agHTML = '<table><thead><tr><th>Cliente</th><th>Data/Hora</th><th>Status</th></tr></thead><tbody>';
        agendamentos.forEach(a => {
          const statusClass = `status-${a.status}`;
          agHTML += `<tr><td><b>${a.clienteNome}</b><br><small style="color:#a1a1aa">${a.clienteTelefone}</small></td><td>${a.data}<br>${a.hora}</td><td><span class="${statusClass}">${a.status.toUpperCase()}</span></td></tr>`;
        });
        agHTML += '</tbody></table>';
        document.getElementById('agendamentos-table').innerHTML = agHTML;

        // Render Serviços
        let serHTML = '<table><thead><tr><th>Serviço</th><th>Preço</th><th>Duração</th></tr></thead><tbody>';
        servicos.forEach(s => {
          serHTML += `<tr><td><b>${s.nome}</b></td><td style="color:var(--gold);font-weight:700">R$ ${s.preco.toFixed(2)}</td><td>${s.duracaoMinutos} min</td></tr>`;
        });
        serHTML += '</tbody></table>';
        document.getElementById('servicos-table').innerHTML = serHTML;

        // Render Profissionais
        let profHTML = '<table><thead><tr><th>Nome</th><th>Especialidade</th></tr></thead><tbody>';
        profissionais.forEach(p => {
          profHTML += `<tr><td><b>${p.nome}</b></td><td>${p.especialidade}</td></tr>`;
        });
        profHTML += '</tbody></table>';
        document.getElementById('profissionais-table').innerHTML = profHTML;

      } catch (err) {
        console.error('Erro ao carregar dados:', err);
      }
    }
    loadData();
  </script>
</body>
</html>
